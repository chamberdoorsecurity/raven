name: Credential Hunting Workflow
description: Comprehensive credential discovery through OSINT and breach data
enabled: true

steps:
  - name: subdomain_enum
    module: subfinder
    description: Discover all subdomains for target
    params: {}

  - name: email_harvest
    module: emailharvest_scope
    description: Harvest email addresses from discovered domains
    condition: subdomains_found
    depends_on:
      - subdomain_enum
    params: {}

  - name: breach_data_check
    module: dehashed_scope
    description: Check harvested emails against breach databases
    condition: emails_found
    depends_on:
      - email_harvest
    params: {}

  - name: github_dork_secrets
    module: github_dork_scope
    description: Search GitHub for leaked credentials and API keys
    condition: subdomains_found
    depends_on:
      - subdomain_enum
    params: {}

  - name: wayback_sensitive_urls
    module: wayback_scope
    description: Find historical URLs that may contain credentials
    condition: subdomains_found
    depends_on:
      - subdomain_enum
    params: {}

  - name: git_repo_exposure
    module: git_exposure
    description: Check for exposed Git repositories with credentials
    condition: web_services_found
    depends_on:
      - subdomain_enum
    params: {}

  - name: api_endpoint_discovery
    module: api_discovery
    description: Discover API endpoints that may leak credentials
    condition: web_services_found
    depends_on:
      - subdomain_enum
    params: {}
