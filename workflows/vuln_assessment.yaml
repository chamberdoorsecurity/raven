# Shipped SEED workflow (read-only template) -- T14.
# Serialized from the built-in Python Workflow of the same id; the id is a
# protected seed (workflow_validate.PROTECTED_SEED_IDS) so a custom save can
# never shadow it. To customize, clone to your engagement (Duplicate) and
# edit the copy -- never edit this file. The Python built-in stays as a
# belt-and-suspenders fallback for this release.
id: vuln_assessment
name: Vulnerability Assessment
description: 'Focus on vulnerability identification: nuclei scan → exploit search → impact analysis'
category: vulnerability
template: true
version: 1
steps:
- name: Comprehensive Vuln Scan
  module: nuclei
  description: Full Nuclei scan (all severities)
  params:
    severity: critical,high,medium,low
- name: Exploit Search
  module: exploits
  description: Search for public exploits
  depends_on:
  - Comprehensive Vuln Scan
